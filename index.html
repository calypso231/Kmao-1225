<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>첫눈이 오면 — K</title>
<style>
:root{
  --bg:#ffffff; --text:#000; --sub:#8e8e93; --blue:#0b84fe; --gray:#e9e9eb;
  --bar:rgba(246,246,248,.86); --line:rgba(0,0,0,.12); --field:#fff; --fieldline:#d1d1d6;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#000; --text:#fff; --sub:#8e8e93; --gray:#262629;
    --bar:rgba(22,22,24,.86); --line:rgba(255,255,255,.12); --field:#000; --fieldline:#3a3a3c; }
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Apple SD Gothic Neo","Noto Sans KR",sans-serif;
  -webkit-font-smoothing:antialiased;overflow:hidden;overscroll-behavior:none;touch-action:pan-y}
#app{position:fixed;inset:0;max-width:480px;margin:0 auto;display:flex;flex-direction:column;background:var(--bg)}

/* header */
header{position:absolute;top:0;left:0;right:0;z-index:5;background:var(--bar);
  backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);
  border-bottom:.5px solid var(--line);padding:calc(env(safe-area-inset-top) + 8px) 12px 8px;
  display:flex;align-items:flex-start;justify-content:space-between}
.back{color:var(--blue);font-size:17px;display:flex;align-items:center;gap:2px;width:70px;padding-top:14px}
.back svg{width:12px;height:20px}
.who{display:flex;flex-direction:column;align-items:center;gap:4px}
.avatar{width:50px;height:50px;border-radius:50%;
  background:linear-gradient(180deg,#a5abb8,#848a97);color:#fff;font-size:22px;font-weight:600;
  display:flex;align-items:center;justify-content:center;letter-spacing:.5px;transition:transform .3s}
.avatar.pulse{animation:pulse .6s}
@keyframes pulse{40%{transform:scale(1.12)}}
.name{font-size:11px;display:flex;align-items:center;gap:2px}
.name svg{width:6px;height:10px;opacity:.5}
.meter{width:70px;display:flex;justify-content:flex-end;padding-top:12px}
.heart{position:relative;width:26px;height:24px}
.heart svg{position:absolute;inset:0;width:26px;height:24px}
.heart .fill{clip-path:inset(100% 0 0 0);transition:clip-path .8s cubic-bezier(.3,.7,.3,1)}

/* chat */
#app,footer,#choices{overflow-x:hidden;max-width:100vw}
#chat{flex:1;overflow-y:auto;overflow-x:hidden;overscroll-behavior-x:none;touch-action:pan-y;
  width:100%;min-width:0;-webkit-overflow-scrolling:touch;
  padding:calc(env(safe-area-inset-top) + 100px) 14px 16px;display:flex;flex-direction:column}
.ts{text-align:center;color:var(--sub);font-size:11px;margin:18px 0 8px}
.ts b{font-weight:600}
.sysnote{text-align:center;color:var(--sub);font-size:12px;margin:18px 0 6px;font-style:italic}
.row{display:flex;margin-top:2px;max-width:100%;min-width:0}
.row.gap{margin-top:10px}
.row.me{justify-content:flex-end}
.bub{position:relative;max-width:76%;padding:7px 12px 8px;border-radius:18px;font-size:16.5px;
  line-height:1.32;word-break:keep-all;overflow-wrap:break-word;animation:pop .28s cubic-bezier(.2,.9,.3,1.2)}
@keyframes pop{from{transform:scale(.6) translateY(8px);opacity:0}to{transform:none;opacity:1}}
.me .bub{background:var(--blue);color:#fff;transform-origin:bottom right}
.k .bub{background:var(--gray);color:var(--text);transform-origin:bottom left}
.bub.tail::before,.bub.tail::after{content:"";position:absolute;bottom:0;height:20px}
.me .bub.tail::before{right:-7px;width:20px;background:var(--blue);border-bottom-left-radius:16px 14px}
.me .bub.tail::after{right:-26px;width:26px;background:var(--bg);border-bottom-left-radius:10px}
.k .bub.tail::before{left:-7px;width:20px;background:var(--gray);border-bottom-right-radius:16px 14px}
.k .bub.tail::after{left:-26px;width:26px;background:var(--bg);border-bottom-right-radius:10px}
.status.fail{color:#ff3b30}
.status{text-align:right;font-size:11px;color:var(--sub);margin:3px 4px 0 0;font-weight:500}
.typing .bub{padding:11px 14px;display:flex;gap:4px}
.typing .bub span{width:8px;height:8px;border-radius:50%;background:var(--sub);opacity:.4;animation:dot 1.2s infinite}
.typing .bub span:nth-child(2){animation-delay:.2s}.typing .bub span:nth-child(3){animation-delay:.4s}
@keyframes dot{30%{opacity:1;transform:translateY(-2px)}60%{opacity:.4;transform:none}}
.floatheart{position:fixed;font-size:18px;color:#ff2d55;pointer-events:none;z-index:20;animation:up 1.1s ease-out forwards}
@keyframes up{to{transform:translateY(-60px) scale(1.4);opacity:0}}

/* ending */
.endcard{margin:26px auto 10px;text-align:center;padding:22px 20px;border-radius:20px;background:var(--gray);
  width:86%;animation:pop .5s}
.endcard small{display:block;font-size:11px;letter-spacing:2px;color:var(--sub);font-weight:600}
.endcard h2{font-size:21px;margin:6px 0 8px}
.endcard p{font-size:13.5px;color:var(--sub);line-height:1.5}
.endcard button{margin-top:14px;border:0;background:var(--blue);color:#fff;font-size:15px;font-weight:600;
  padding:9px 22px;border-radius:20px;font-family:inherit;cursor:pointer}

/* bottom */
footer{background:var(--bg);padding:6px 10px calc(env(safe-area-inset-bottom) + 8px)}
#choices{display:flex;flex-direction:column;gap:6px;align-items:flex-end;padding:0 2px 8px}
#choices:empty{display:none}
.chlabel{font-size:11px;color:var(--sub);align-self:center;margin-bottom:2px}
.ch{border:1px solid var(--blue);color:var(--blue);background:transparent;border-radius:18px;
  padding:8px 14px;font-size:15px;font-family:inherit;text-align:left;max-width:88%;cursor:pointer;
  word-break:keep-all;animation:pop .3s backwards}
.ch:active{background:var(--blue);color:#fff}
.inputbar{display:flex;align-items:center;gap:8px}
.plus{width:34px;height:34px;border-radius:50%;background:var(--gray);display:flex;align-items:center;justify-content:center;flex:none}
.plus svg{width:14px;height:14px}
.field{flex:1;min-height:36px;border:1px solid var(--fieldline);border-radius:18px;background:var(--field);
  display:flex;align-items:center;padding:4px 4px 4px 13px;font-size:16px}
.field .ph{color:var(--sub);flex:1}
.field .txt{flex:1;color:var(--text);line-height:1.3;padding:4px 0;white-space:pre-wrap;word-break:keep-all;overflow-wrap:break-word}
.caret{display:inline-block;width:2px;height:1.15em;background:var(--blue);margin-left:1px;vertical-align:-.2em;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.field:has(.txt:not([hidden])){align-items:flex-end}
.send{cursor:pointer;margin-bottom:0;width:30px;height:30px;border-radius:50%;background:var(--blue);display:none;align-items:center;justify-content:center;flex:none}
.send svg{width:14px;height:14px}
.field.on .send{display:flex;animation:pop .25s}

/* lock screen */
#lock{position:fixed;inset:0;z-index:50;color:#fff;display:flex;flex-direction:column;align-items:center;
  background:radial-gradient(120% 80% at 50% 0%,#3b4a6b 0%,#1a2033 55%,#0b0d16 100%);
  padding:calc(env(safe-area-inset-top) + 56px) 18px calc(env(safe-area-inset-bottom) + 30px);
  transition:transform .55s cubic-bezier(.5,0,.2,1),opacity .55s;cursor:pointer;overflow:hidden}
#lock.gone{transform:translateY(-100%);opacity:.6}
.ldate{font-size:20px;font-weight:500;opacity:.9}
.ltime{font-size:92px;font-weight:600;letter-spacing:-2px;line-height:1;margin-top:2px;
  font-family:-apple-system,"SF Pro Display",sans-serif}
.notif{margin-top:54px;width:100%;max-width:400px;background:rgba(255,255,255,.22);
  backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);border-radius:22px;padding:12px 14px;
  display:flex;gap:11px;align-items:center;animation:drop .7s .6s cubic-bezier(.2,.9,.3,1.2) backwards}
@keyframes drop{from{transform:translateY(-30px) scale(.9);opacity:0}}
.notif .avatar{width:38px;height:38px;font-size:16px;flex:none}
.notif .nt{flex:1;min-width:0}
.notif .nh{display:flex;justify-content:space-between;font-size:15px;font-weight:600}
.notif .nh span{font-weight:400;font-size:13px;opacity:.7}
.notif .nb{font-size:15px;margin-top:1px}
.lfoot{margin-top:auto;text-align:center}
.lfoot h1{font-size:15px;font-weight:600;letter-spacing:3px;opacity:.95}
.lfoot p{font-size:12px;opacity:.6;margin-top:6px}
.lfoot .bar{width:134px;height:5px;border-radius:3px;background:#fff;margin:22px auto 0;opacity:.9}
#off{position:fixed;inset:0;z-index:60;background:#000;opacity:0;pointer-events:none;transition:opacity .8s;
  display:flex;align-items:center;justify-content:center}
#off.on{opacity:1;pointer-events:auto}
#zzz{color:#fff;font-size:22px;letter-spacing:4px;opacity:0;transition:opacity 1s}
#zzz.on{opacity:.55}
.sleepbtn{align-self:center;border:0;background:var(--gray);color:var(--text);border-radius:20px;
  padding:10px 20px;font-size:15px;font-family:inherit;display:flex;align-items:center;gap:8px;cursor:pointer;animation:pop .35s}
.sleepbtn svg{width:16px;height:16px}
.notif2{margin-top:8px;animation-delay:.9s}
#banner{position:fixed;z-index:40;top:calc(env(safe-area-inset-top) + 8px);left:50%;width:calc(100% - 16px);max-width:464px;
  transform:translate(-50%,-160%);transition:transform .5s cubic-bezier(.2,.9,.3,1.1);
  background:rgba(245,245,247,.82);backdrop-filter:blur(30px) saturate(180%);-webkit-backdrop-filter:blur(30px) saturate(180%);
  border-radius:22px;padding:11px 13px;display:flex;gap:10px;align-items:center;color:#000;
  box-shadow:0 8px 30px rgba(0,0,0,.18);cursor:pointer}
@media (prefers-color-scheme: dark){#banner{background:rgba(44,44,46,.85);color:#fff}}
#banner.show{transform:translate(-50%,0)}
.bicon{width:38px;height:38px;border-radius:9px;flex:none;display:flex;align-items:center;justify-content:center;font-size:21px}
.bt{flex:1;min-width:0}
.bh{display:flex;justify-content:space-between;font-size:13px;opacity:.85}
.bh span{font-weight:400;opacity:.7}
.btitle{font-size:15px;font-weight:600;margin-top:1px}
.bbody{font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#call{position:fixed;inset:0;z-index:65;touch-action:none;user-select:none;-webkit-user-select:none;display:none;flex-direction:column;align-items:center;justify-content:space-between;color:#fff;
  background:linear-gradient(180deg,#59606e 0%,#353a46 45%,#1c1f27 100%);
  padding:calc(env(safe-area-inset-top) + 70px) 24px calc(env(safe-area-inset-bottom) + 50px);transition:opacity .5s}
#call.fade{opacity:0}
.cname{font-size:34px;font-weight:400;text-align:center;letter-spacing:.3px}
.csub{font-size:17px;opacity:.65;text-align:center;margin-top:4px}
.cbottom{width:100%;display:flex;flex-direction:column;align-items:center;gap:44px}
.copts{display:flex;justify-content:space-between;width:min(300px,100%);transition:opacity .3s}
.copt{display:flex;flex-direction:column;align-items:center;gap:7px;font-size:13px}
.cic{width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center}
.cic svg{width:22px;height:22px}
.slider{position:relative;cursor:grab;user-select:none;-webkit-user-select:none;width:min(310px,100%);height:72px;border-radius:36px;background:rgba(255,255,255,.18);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);display:flex;align-items:center;touch-action:none;transition:opacity .3s}
.knob{position:absolute;left:5px;top:5px;width:62px;height:62px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;z-index:2;cursor:grab}
.knob svg{width:28px;height:28px}
.stext{flex:1;text-align:center;padding-left:60px;font-size:19px;
  background:linear-gradient(90deg,rgba(255,255,255,.45) 0%,#fff 50%,rgba(255,255,255,.45) 100%);background-size:200% 100%;
  -webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 2.4s linear infinite}
@keyframes shine{from{background-position:150% 0}to{background-position:-50% 0}}
@keyframes ringbuzz{0%,100%{transform:none}25%{transform:translateX(-1.5px)}75%{transform:translateX(1.5px)}}
#call.ring .cname{animation:ringbuzz .12s 6}
#crack{position:fixed;inset:0;z-index:45;pointer-events:none;display:none}
#crack svg{width:100%;height:100%}
#crack path{fill:none;stroke-linecap:round;stroke-linejoin:round}
#crack .c{animation:drawc .22s ease-out forwards}
@keyframes drawc{to{stroke-dashoffset:0}}
#flash{position:fixed;inset:0;z-index:46;background:#fff;opacity:0;pointer-events:none}
#flash.on{animation:flash .35s ease-out}
@keyframes flash{0%{opacity:.7}100%{opacity:0}}
#app.shake{animation:shake .45s cubic-bezier(.36,.07,.19,.97)}
@keyframes shake{10%,90%{transform:translate(-2px,1px)}20%,80%{transform:translate(4px,-2px)}30%,50%,70%{transform:translate(-7px,3px)}40%,60%{transform:translate(7px,-3px)}}
#hiddenBtn{display:block;margin:0 auto 22px;border:0;border-radius:18px;padding:8px 16px;font-family:inherit;font-size:13px;
  color:#fff;background:rgba(90,0,16,.55);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);cursor:pointer}
.imgbub{width:62%;max-width:240px;border-radius:18px;overflow:hidden;animation:pop .35s;line-height:0}
.imgbub svg{width:100%;height:auto;display:block}
html.eerie{--bg:#08080a;--gray:#1c1c20;--text:#d8d8dc;--sub:#6c6c72;--bar:rgba(10,10,12,.88);--line:rgba(255,255,255,.06);--field:#08080a;--fieldline:#26262b}
#app,#chat,header,footer,.bub,.bub::before,.bub::after,.field,html,body{transition:background-color 4s ease,color 4s ease,border-color 4s ease}
html.eerie .sysnote{color:#8a8a90;letter-spacing:2px}
.flake{position:absolute;top:-10px;border-radius:50%;background:#fff;opacity:.8;animation:fall linear infinite}
@keyframes fall{to{transform:translateY(110vh) translateX(30px)}}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="back"><svg viewBox="0 0 12 20"><path d="M10 2 2 10l8 8" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></div>

<script>
/* ---------------- 스토리 ----------------
   k: K의 메시지들, ch: 선택지 {x:주인공 대사, a:호감도, n:다음 노드}
   ts: 날짜 구분선, note: 장면 전환 문구 */
const S = {
  start:{ts:['11월 8일 (일)','오후 11:42'], k:['자?','지금 가게인데 손님 화장실 간 사이에 보내는 거야.','빨리 답장해, 마오위. 나 시간 없어.'], ch:[
    {x:'안 자요! 오늘 도쿄에 첫눈 올 수도 있대서 기다리는 중이에요 ㅎㅎ',a:2,n:'s1a'},
    {x:'일하는 중에 연락한 거예요? 케이가 먼저 연락하는 거 처음이네요?',a:3,n:'s1b'},
    {x:'내일 출근이라 곧 자려고 했는데... 무슨 일 있어요?',a:1,n:'s1c'}]},
  s1a:{k:['11월에? 도쿄에?','그거 몇십 년에 한 번 있는 일인데. 너 일기예보 너무 믿는다.','크리스마스쯤이면 또 몰라.','...근데 오면 제일 먼저 알려줘. 가게 안에선 창문이 안 보이거든.'], ch:[
    {x:'좋아요! 제가 케이 전용 기상캐스터 할게요',a:1,n:'s1a2'},
    {x:'케이랑 같이 보면 좋겠다...',a:2,n:'s1a3'}]},
  s1a2:{k:['월급은 없다?','아, 손님 온다. 간다.','눈 안 와도 내일 또 연락할게.'], n:'d2'},
  s1a3:{k:['와.','이런 말 가게에서 들으면 샴페인 한 병 값인데.','너한텐 공짜로 들었네. 이득. ...잘 자, 마오위.'], n:'d2'},

function showCall(){
  return new Promise(res => {

    const down = e => { if (done) return; e.preventDefault(); dragging = true; moved = false; dx = 0;
      startX = px(e); knob.style.transition = 'none'; };
    const move = e => { if (!dragging) return; e.preventDefault();
      dx = Math.max(0, Math.min(max(), px(e) - startX)); if (dx > 6) moved = true;

      if (dx >= max() * 0.92) up(); };                // 거의 끝까지 밀면 바로 응답
    const up = () => { if (!dragging) return; dragging = false;
      if (!moved || dx > max() * 0.45) finish('answered');
      else { knob.style.transition = 'transform .3s cubic-bezier(.3,1.4,.5,1)'; knob.style.transform = 'translateX(0)'; }
      dx = 0; };

  }
  if (n.note){ await wait(1500); addNote(n.note); scroll(); }
  for (let i = 0; i < n.k.length; i++){
    if (i === 0 && instant){ await wait(500); addBubble('k', n.k[0]);
      if (lockNudge){ addBubble('k', lockNudge); lockNudge = null; } }  // 알림으로 이미 받은 메시지
    else if (typeof n.k[i] === 'object') await kEerie(n.k[i]);
    else await kSays(n.k[i], i > 0);
  }
  if (n.crack){ await wait(1600); crackScreen(); await wait(2600); }
  if (n.end){ await wait(1800); return showEnd(n.end, id); }
  if (n.n) return play(n.n);
  await wait(800); showChoices(n.ch);
}

/* ---------- 메타 요소: 답장 안 하면 K가 재촉 ---------- */
let idleTok = 0, idleTimer = null, idleSpeaking = false;
const CHOICE_IDLE = [
  [12000, [['마오위?'], ['읽었잖아. 읽음 떠 있는데.'], ['왜 답장 안 해~']]],
  [30000, [['뭐라고 보낼지 고민하는구나.', '썼다 지웠다 하는 거 다 알아.'], ['읽고 답장 안 하는 거, 그거 내가 손님들한테 쓰는 수법인데.']]],
  [55000, [['그렇게 고민할 정도야?', '아무렇게나 보내. ...아니, 아무렇게나는 말고.']]],
  [90000, [['나 원래 손님들 답장 같은 거 안 기다리거든.', '근데 너는 기다리게 되네. 이상하게.']]],
  [150000,[['...설마 폰 들고 잠든 거 아니지?', '잠들었으면 일어나서 답장해. 기다릴게.']]]
];
const EERIE_IDLE = [
  [14000, [['답장해.']]],
  [34000, [['또 기다리게 하네.']]],
  [70000, [['괜찮아.', '기다릴게.']]]
];
const SLEEP_IDLE = [
  [15000, [['안 자?']]],
  [32000, [['폰 그만 보고 자. 내일 출근이잖아, 회사원.']]],
  [65000, [['...나랑 더 얘기하고 싶어서 그래?', '그래도 자. 내일 또 연락할게.']]]
];
const BREAK_IDLE = [
  [15000, [['일 안 해?']]],
  [35000, [['폰 그만 보고 일해. 부장님한테 혼난다.']]]
];
async function idleSay(text, tok){
  await wait(300 + Math.random()*400);
  if (tok !== idleTok) return false;
  const t = document.createElement('div'); t.className = 'row k typing' + (lastSender==='me'?' gap':'');
  t.innerHTML = '<div class="bub"><span></span><span></span><span></span></div>';
  chat.appendChild(t); scroll();
  await wait((500 + [...text].length * 110) * (0.8 + Math.random()*0.4));
  t.remove();
  if (tok !== idleTok) return false;
  addBubble('k', text); return true;
}
async function idleLines(lines, tok){
  if (idleSpeaking) return; idleSpeaking = true;
  for (const l of lines){ if (!await idleSay(l, tok)) break; }
  idleSpeaking = false;
}
function startIdle(stages){
  stopIdle(); if (kGone) return; const tok = idleTok; let i = 0;
  const next = () => {
    if (i >= stages.length) return;
    const [ms, pool] = stages[i], gap = ms - (i ? stages[i-1][0] : 0);
    idleTimer = setTimeout(async () => {
      if (tok !== idleTok) return;
      await idleLines(pool[Math.floor(Math.random()*pool.length)], tok);
      if (stages === CHOICE_IDLE && i >= 1 && !waitedCounted && tok === idleTok){ obsess++; waitedCounted = true; }  // 오래 기다리게 함
      i++; next();
    }, gap);
  };
  next();
}
function stopIdle(){
  idleTok++; clearTimeout(idleTimer); idleSpeaking = false;
  chat.querySelectorAll('.typing').forEach(e => e.remove());
}

function showChoices(list){
  chBox.innerHTML = '<div class="chlabel">답장 고르기</div>';
  list.forEach((c,i)=>{
    const b=document.createElement('button'); b.className='ch'; b.textContent=c.x; b.style.animationDelay=(i*.07)+'s';
    b.onclick=()=>choose(c); chBox.appendChild(b);
  });
  waitedCounted = false;
  scroll(); startIdle(eerie ? EERIE_IDLE : CHOICE_IDLE); if (!eerie) maybeAd(kGone ? .5 : .28);
}
const tval = document.getElementById('tval');
const TYPED_IDLE = [
  [10000, [['쓰다 말고 뭐 해?'], ['입력 중... 떴다가 멈췄네.']]],
  [28000, [['다 쓴 거 아니야? 보내.', '안 보내면 내가 먼저 맞혀본다.']]]
];
let pending = null;
async function choose(c){
  if (busy) return; busy = true; stopIdle();
  chBox.innerHTML = '';
  ph.hidden = true; txt.hidden = false; tval.textContent = '';
  for (const ch of [...c.x]){                       // 한 글자씩 입력
    tval.textContent += ch;
    await wait(55 + Math.random()*75 + (/[.,!?~…]/.test(ch) ? 140 : 0) + (ch === ' ' ? 40 : 0));
  }
  field.classList.add('on');                        // 전송 버튼 활성화
  pending = c; startIdle(TYPED_IDLE);
}
document.getElementById('sendBtn').addEventListener('click', () => {
  if (!pending) return; const c = pending; pending = null; sendChoice(c);
});
async function sendChoice(c){
  stopIdle();
  ph.hidden = false; txt.hidden = true; tval.textContent = ''; field.classList.remove('on');
  if (statusEl) statusEl.remove();
  const row = addBubble('me', c.x);
  statusEl = document.createElement('div'); statusEl.className='status'; statusEl.textContent='전송됨';
  if (eerie){ const se = statusEl; setTimeout(() => { se.textContent = '읽음'; }, 120); }  // 보내자마자 읽음
  row.after(statusEl);
  if (c.fail){ await wait(1800); statusEl.textContent = '⚠︎ 전송되지 않음'; statusEl.classList.add('fail'); await wait(1200); }
  score += c.a; obsess += c.o || 0; setHeart();
  if (c.a >= 2) floatHeart(c.a >= 3 ? 3 : 1);
  busy = false;
  await play(c.n);
}
function showEnd([tag,title,desc], id){
  const e=document.createElement('div'); e.className='endcard';
  e.innerHTML=`<small>${tag}</small><h2>${title}</h2><p>${desc}</p><p style="margin-top:8px">호감도 ${Math.max(0,score)} / ${MAX}</p><button>처음부터 다시</button>`;
  e.querySelector('button').onclick=restart;
  chat.appendChild(e); lastSender=null; scroll();
}
async function restart(){
  off.classList.add('on'); await wait(900);
  document.getElementById('crack').style.display='none'; document.getElementById('crack').innerHTML='';
  chat.innerHTML=''; chBox.innerHTML=''; kGone=false; pending=null; obsess=0; fastK=false; eerie=false; document.documentElement.classList.remove('eerie');
  document.querySelectorAll('.heart path').forEach(p => p.getAttribute('fill') !== 'none' ? p.setAttribute('fill','#ff2d55') : p.setAttribute('stroke','#ff2d55')); score=0; lastSender=null; statusEl=null; lastDate=null; setHeart();
  const p = showLock(S.start.ts, S.start.k[0], true);
  off.classList.remove('on'); await p;
  play('start', true);
}

const banner = document.getElementById('banner');
let lastAd = 0, usedAds = [], adTimer = null, bannerHide = null;
function pickAd(){
  const dec = /^(12|1)월/.test(lastDate || '');
  let pool = ADS.filter((a,i) => !usedAds.includes(i) && (!a.m || dec));
  if (!pool.length){ usedAds = []; pool = ADS.filter(a => !a.m || dec); }
  const a = pool[Math.floor(Math.random()*pool.length)]; usedAds.push(ADS.indexOf(a)); return a;
}
function showAd(){
  if (lock.style.display !== 'none' || off.classList.contains('on')) return;
  const a = pickAd(); lastAd = Date.now();
  const ic = document.getElementById('bicon'); ic.textContent = a.icon; ic.style.background = a.bg;
  document.getElementById('bapp').textContent = a.app;
  document.getElementById('btitle').textContent = a.t;
  document.getElementById('bbody').textContent = a.b;
  banner.classList.add('show');
  clearTimeout(bannerHide); bannerHide = setTimeout(() => banner.classList.remove('show'), 4500);
}
banner.addEventListener('click', () => banner.classList.remove('show'));
function maybeAd(chance){
  if (Date.now() - lastAd < 45000 || Math.random() > chance) return;
  clearTimeout(adTimer); adTimer = setTimeout(showAd, 2500 + Math.random()*6000);
}
